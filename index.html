<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>مالی‌پرو | دانلود اپ</title>
<style>:root{--bg:#fff;--text:#111;--muted:#666;--accent:#000;--border:#e5e5e5;--card:#fafafa}[data-theme=dark]{--bg:#0a0a0a;--text:#f5f5f5;--muted:#aaa;--accent:#fff;--border:#222;--card:#111}*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Vazirmatn",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7}.container{max-width:720px;margin:0 auto;padding:2rem 1.25rem;text-align:center}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:3rem;text-align:right}h1{font-size:2.6rem;margin-bottom:1rem}.stores{display:flex;gap:1rem;justify-content:center;margin:2rem 0;flex-wrap:wrap}.store{border:1px solid var(--border);padding:1rem 1.5rem;border-radius:8px;background:var(--card);min-width:140px}button.theme{background:none;border:1px solid var(--border);color:var(--text);padding:0.4rem 0.8rem;border-radius:6px;cursor:pointer}</style>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet"></head>
<body><div class="container"><header><div style="text-align:right;width:100%">مالی‌پرو</div><button class="theme" onclick="toggleTheme()">تم</button></header><h1>مدیریت مالی شخصی</h1><p style="color:var(--muted);font-size:1.15rem;margin-bottom:2rem">درآمد، هزینه و پس‌انداز را با راهنمای فارسی پیگیری کنید. امن، ساده و قدرتمند.</p><div class="stores"><div class="store">App Store</div><div class="store">Google Play</div><div class="store">نسخه وب</div></div><p style="color:var(--muted)">رایگان برای شروع. پلن پرو با قابلیت همگام‌سازی بانکی.</p></div>
<script>function toggleTheme(){const h=document.documentElement;const c=h.getAttribute('data-theme')||'light';h.setAttribute('data-theme',c==='light'?'dark':'light');localStorage.setItem('theme',h.getAttribute('data-theme'));}if(localStorage.getItem('theme')==='dark'||(!localStorage.getItem('theme')&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');</script></body></html>
